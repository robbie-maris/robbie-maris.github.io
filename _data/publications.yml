- theme: "Environmental and Behavioural Economics"
  publications:
    - title: "Information Nudging and Monetary Incentives: A Green Partnership for Volunteering?"
      authors: "Maris, R., Dorner, Z., & Carlsson, F."
      year: 2025
      journal: "Environmental and Resource Economics, 88(9)"
      link: "https://link.springer.com/article/10.1007/s10640-025-01018-5"
      abstract: >
      Shifting individual behaviour is an important tool for addressing environmental issues and there is a wide literature evaluating interventions to encourage pro-environmental behaviour. One important question is the effect of combining interventions to affect behaviour. In this paper, we evaluate the effects of two interventions – a monetary incentive and an information nudge targeting intrinsic motivation – on nature restoration volunteering. We use a two-by-two treatment design to evaluate the individual and combined effects of the interventions in a field experiment setting. We find that neither the monetary incentive nor the information nudge alone are effective at shifting behaviour. However, there are considerable positive synergies between the monetary incentive and nudge. The monetary incentive becomes more than twice as effective when it is combined with an information nudge. Our results have important policy implications, showing that concerns around motivation crowding out from monetary incentives could be mitigated by simple, low-cost information nudges targeting intrinsic motivation.
      image: "/images/pub_volunteering_image.png"

    - title: "Environmental Identity in Economics and Policymaking"
      authors: "Dorner, Z., Maris, R., & Carlsson, F."
      year: 2025
      journal: "Review of Environmental Economics and Policy (forthcoming)"
      link: "https://doi.org/10.1093/reep/rev010"
      abstract: >
        We propose the concept of “environmental identity” to explain heterogeneity in pro-environmental preferences
        and policy support. Using survey and experimental data, we show that self-identified environmentalists exhibit
        stronger willingness to pay for climate policies even after controlling for income and ideology.
      image: "/images/pub_env_identity.png"

    - title: "The Labour Market Trade-offs of Pet Ownership"
      authors: "Maris, R., & Cameron, M. P. (2023)"
      journal: "Economics and Business Letters, 12(1)"
      link: "https://reunido.uniovi.es/index.php/EBL/article/view/18289"
      abstract: >
        Using microdata from New Zealand, we estimate the relationship between pet ownership and labour market
        outcomes. Pet owners are more likely to choose flexible work arrangements but work fewer hours on average,
        suggesting lifestyle preferences rather than productivity effects.
      image: "/images/pub_pet_labour.png"

- theme: "Education and Labour"
  publications:
    - title: "Blending Academic and Vocational Education: The Impact of T Levels"
      authors: "Maris, R."
      year: 2025
      journal: "CEPEO Working Paper No. 25-11, University College London"
      link: "https://EconPapers.repec.org/RePEc:ucl:cepeow:25-11"
      abstract: >
        This study estimates the impact of England’s new T Level qualifications on student outcomes and progression.
        Using administrative data, I find that T Levels improve vocational alignment and post-16 retention but show
        mixed effects on academic progression.
      image: "/images/pub_tlevels.png"

    - title: "English and Maths Resits: Drivers of Success"
      authors: "Maris, R., & Robinson, D."
      year: 2025
      journal: "Education Policy Institute"
      link: "https://epi.org.uk/publications-and-research/english-and-maths-resits-drivers-of-success/"
      abstract: >
        We use national administrative data to identify factors influencing the success of students retaking English
        and maths GCSEs. The results highlight the importance of prior attainment, teaching quality, and institutional
        support structures.
      image: "/images/pub_resits.png"


- theme: "Interdisciplinary"
  publications:
    - title: "The impact of commitments on longitudinal survey attrition"
      authors: "Maris, R."
      year: 2025
      journal: "International Journal of Social Research Methodology"
      link: "https://www.tandfonline.com/doi/full/10.1080/13645579.2025.2544123"
      abstract: >
        Attrition is a pervasive problem in longitudinal research. While attrition often stems from commonly reported on demographic characteristics, attrition can also be influenced by study design features that invoke behavioural responses in participants. One study feature that could impact attrition is the use of commitments (asking respondents to commit to a behaviour). In this paper, for the first time, we explore the impacts of using commitments on attrition in a field experiment. We ask survey respondents whether they would like to pre-commit to attending a nature restoration volunteering event. Surprisingly, we find that the attrition rate is 16 percentage points worse for those who are pre-committed to an event. Using linear probability models, we explore this finding and theorise that ingenuine commitments provoke feelings of guilt and respondents actively avoid these feelings by dropping out. These results have important implications, especially if feelings of guilt drive longer-term disengagement with policy and research.
      image: image: "/images/pub_commitments_image.jpg"

